<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario de Libros | Librería</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a th:href="@{/dashboard}" class="nav-link">Inicio</a>
            </li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-info elevation-4">
        <a th:href="@{/dashboard}" class="brand-link text-center">
            <span class="brand-text font-weight-light"><b>Librería</b> UPIIZ</span>
        </a>

        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item">
                        <a th:href="@{/dashboard}" class="nav-link">
                            <i class="nav-icon fas fa-home"></i>
                            <p>Inicio</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/libros}" class="nav-link active">
                            <i class="nav-icon fas fa-book"></i>
                            <p>Gestión de Libros</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/ventas}" class="nav-link">
                            <i class="nav-icon fas fa-shopping-cart"></i>
                            <p>Ventas</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Catálogo de Libros</h1>
                    </div>
                    <div class="col-sm-6 text-right">
                        <a th:href="@{/dashboard}" class="btn btn-secondary mr-2">
                            <i class="fas fa-arrow-left"></i> Volver al Dashboard
                        </a>
                        <a th:href="@{/libros/nuevo}" class="btn btn-success">
                            <i class="fas fa-plus-circle"></i> Agregar Libro
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <h3 class="card-title">Listado de Libros Disponibles</h3>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="bg-light">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="libro : ${libros}">
                                <td th:text="${libro.id}">1</td>
                                <td th:text="${libro.titulo}">Título</td>
                                <td th:text="${libro.autor}">Autor</td>
                                <td th:text="'$' + ${libro.precio}">$0.00</td>
                                <td>
                                    <span th:text="${libro.stock}"
                                          th:class="${libro.stock < 5} ? 'badge badge-danger' : 'badge badge-success'">
                                        0
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/libros/editar/{id}(id=${libro.id})}" class="btn btn-sm btn-info" title="Editar">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}" class="btn btn-sm btn-danger"
                                       title="Eliminar" onclick="return confirm('¿Eliminar este libro?');">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(libros)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    No hay libros registrados.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="main-footer">
        <strong>Librería Luis Eduardo Carrillo &copy; 2026</strong>
    </footer>
</div>

<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
</body>
</html>
