<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="card card-outline card-info">
        <div class="card-body login-card-body">
            <p class="login-box-msg">¿Olvidaste tu contraseña? Ingresa tu correo para recuperarla.</p>

            <div th:if="${mensaje}" class="alert alert-success text-sm">
                <span th:text="${mensaje}"></span>
            </div>

            <form th:action="@{/auth/forgot-password}" method="post" th:if="${mensaje == null}">
                <div class="input-group mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-envelope text-info"></span></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-info btn-block">Enviar enlace</button>
            </form>

            <p class="mt-3 mb-1">
                <a th:href="@{/auth/login}" class="text-info">Regresar al login</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
