<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${tituloPagina}">Formulario Libro</title>
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6"><h1 th:text="${tituloPagina}">Libro</h1></div>
                    <div class="col-sm-6 text-right">
                        <a th:href="@{/libros}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="card card-info">
                <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <div class="form-group">
                            <label>Título</label>
                            <input type="text" th:field="*{titulo}" class="form-control" required placeholder="Ej. El Quijote">
                        </div>
                        <div class="form-group">
                            <label>Autor</label>
                            <input type="text" th:field="*{autor}" class="form-control" required placeholder="Ej. Miguel de Cervantes">
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <label>Precio</label>
                                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label>Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-info">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</body>
</html>
