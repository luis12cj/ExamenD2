<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Factura Detalle | Librería</title>
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @media print { .no-print { display: none !important; } }
        /* Estilo para que el PDF no salga pegado a las orillas */
        .pdf-container { padding: 20px; background: white; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <div class="content-wrapper" style="margin-left: 0;">
        <section class="content">
            <div class="container-fluid pt-4">
                <div id="factura-pdf" class="pdf-container">
                    <div class="invoice p-3 mb-3 border rounded shadow-sm">
                        <div class="row">
                            <div class="col-12">
                                <h4>
                                    <i class="fas fa-book"></i> <b>Librería UPIIZ</b>
                                    <small class="float-right">Fecha: <span th:text="${factura.fecha}"></span></small>
                                </h4>
                            </div>
                        </div>
                        <div class="row invoice-info mt-3">
                            <div class="col-sm-4 invoice-col">
                                De: <strong>Luis Eduardo Carrillo</strong><br>
                                UPIIZ - IPN
                            </div>
                            <div class="col-sm-4 invoice-col">
                                Para: <strong th:text="${factura.cliente}"></strong><br>
                                Cliente Registrado
                            </div>
                            <div class="col-sm-4 invoice-col">
                                <b>Factura #<span th:text="${factura.id}"></span></b><br>
                                <b>Venta ID:</b> <span th:text="${factura.id}"></span>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-12 table-responsive">
                                <table class="table table-striped border">
                                    <thead class="bg-primary text-white">
                                    <tr>
                                        <th>Cant</th>
                                        <th>Descripción</th>
                                        <th>Estado</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr>
                                        <td th:text="${factura.cantidad}"></td>
                                        <td>Venta de libros (Folio: <span th:text="${factura.id}"></span>)</td>
                                        <td><span class="badge badge-success">Completado</span></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row no-print mt-3 p-3">
                    <div class="col-12">
                        <button type="button" onclick="generarPDFDirecto();" class="btn btn-danger float-right">
                            <i class="fas fa-file-pdf"></i> DESCARGAR PDF
                        </button>
                        <button type="button" onclick="window.print();" class="btn btn-primary float-right mr-2">
                            <i class="fas fa-print"></i> Imprimir
                        </button>
                        <a th:href="@{/facturacion}" class="btn btn-default float-right mr-2">Regresar</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<script th:inline="javascript">
    function generarPDFDirecto() {
        const elemento = document.getElementById('factura-pdf');
        const idFactura = [[${factura.id}]];

        const opciones = {
            margin:       1,
            filename:     'Factura_Libreria_' + idFactura + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        // Esta librería "toma una foto" del HTML y la convierte en PDF descargable
        html2pdf().set(opciones).from(elemento).save();
    }
</script>

</body>
</html>
